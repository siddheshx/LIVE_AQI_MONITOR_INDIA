services:
  postgres:
    image: postgres:17
    container_name: live_aqi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: live_aqi_india
      POSTGRES_USER: aqi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqi_user -d live_aqi_india"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 